<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spotify Music Settings</title><style>body{max-width:620px;margin:40px auto;padding:0 20px;color:#24292f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:24px}section{padding:18px;border:1px solid #d0d7de;border-radius:8px}p{color:#57606a;line-height:1.5}a{color:#0969da}</style></head><body><h1>Spotify Music</h1><section><h2>About</h2><p>This extension uses Spotify's official embedded player. It does not request your Spotify password or store Spotify credentials. Playback and availability are controlled by Spotify.</p><p>To use it, paste a link from <a href="https://open.spotify.com" target="_blank">open.spotify.com</a> into the extension popup.</p></section></body></html>
